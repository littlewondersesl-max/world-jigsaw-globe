   /* region instances: per-chunk frustum + distance LOD, only while the region is active */
   if(c.obj.inst){c.obj.root.updateMatrixWorld(true);for(const k of c.obj.inst.chunks){let v=false;if(c.active){CW.copy(k.c).applyMatrix4(c.obj.root.matrixWorld);const dd=C.position.distanceTo(CW);v=dd<(k.kind==='t'?.0065:.0055)+k.r*KM*10&&FR.intersectsSphere(SPH.set(CW,k.r*KM*10))}if(v&&!k.built){k.build();k.built=true}k.g.visible=v}}
   /* terrain collision: keep >=400 m above the ground under the camera */
   if(d<.02){c.obj.root.updateMatrixWorld(true);const L=c.obj.root.worldToLocal(C.position.clone());const [L0,L1,A0_,A1_]=c.obj.meta.bbox;let h=c.obj.sAt?c.obj.sAt(L.x,L.z):0;
    const hx=c.obj.meta.WX/2,hz=c.obj.meta.HZ/2;if(Math.abs(L.x)<hx&&Math.abs(L.z)<hz)h=Math.max(h,c.obj.hAt(L.x,L.z));h=Math.max(h,0);
    if(L.y<h+.04){L.y=h+.04;C.position.copy(c.obj.root.localToWorld(L))}}PU.con.value[c.i]=a>.55?1:0;PU.cw.value[c.i]=ss(.16,.09,d)}
  info.push(c.name+': '+c.state+' d='+d.toFixed(3))}
 lodEl.textContent=info.join(' | ')+' alt≈'+(alt/KM).toFixed(0)+' km';}

  const d0=p0.length(),d1=1.5+alt0;const dir=p0.clone().normalize().lerp(wp,ss(0,.6,x)).normalize();const d=Math.exp(Math.log(d0)*(1-e)+Math.log(d1)*e);C.position.copy(dir.multiplyScalar(d));if(x>=1)fly=null}}

 O.target.copy(T);O.minDistance=.00012;O.maxPolarAngle=1.38;C.up.copy(n);const s=new THREE.Vector3(0,-1,0).projectOnPlane(n).normalize();C.position.copy(T).addScaledVector(n,alt*Math.cos(tl)).addScaledVector(s,alt*Math.max(.02,Math.sin(tl)));C.lookAt(T);O.update();return 'ok'};
