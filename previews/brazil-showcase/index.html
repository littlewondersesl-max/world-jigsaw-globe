<script type="module">
import * as THREE from 'three';import {OrbitControls} from '../brazil/OrbitControls.js';import {loadCity} from '../lib/city.js';
const still=location.search.includes('still');
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x1d1b19);
const C=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.002,40);const O=new OrbitControls(C,R.domElement);O.enableDamping=!still;O.maxPolarAngle=1.45;
S.add(new THREE.HemisphereLight(0xfff4e6,0x40382e,.9));const sd=new THREE.Vector3(-2,3,-1.5);const sun=new THREE.DirectionalLight(0xfff0dc,2.2);sun.position.copy(sd);sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-2.3,right:2.3,top:1.5,bottom:-1.5,near:.1,far:10});sun.shadow.bias=-.0004;sun.shadow.normalBias=.002;S.add(sun);
const city=await loadCity('./','rio_',{walls:true,shadows:true,sun:sd.clone().normalize()});S.add(city.root);
const P={overview:[-43.225,-22.915,4.2,.85,0],copacabana:[-43.185,-22.972,.42,.95,.3],sugarloaf:[-43.160,-22.952,.16,1.05,-.6],corcovado:[-43.2105,-22.952,.16,1.0,.9],
 centro:[-43.1775,-22.9045,.2,.9,.35],niteroi:[-43.110,-22.905,.5,.95,-.4],lagoa:[-43.210,-22.975,.35,.95,0],tijuca:[-43.265,-22.950,1.0,.95,.5],barra:[-43.35,-23.0,.9,1.0,.2]};
window.SH=k=>{const[lo,la,d,pol,az]=P[k];const[x,z]=city.ll(lo,la);const t=new THREE.Vector3(x,Math.max(city.hAt(x,z),0),z);
 O.target.copy(t);C.position.set(t.x+d*Math.sin(pol)*Math.sin(az),t.y+d*Math.cos(pol),t.z+d*Math.sin(pol)*Math.cos(az));O.update();};
const bd=document.getElementById('b');for(const k in P){const e=document.createElement('button');e.textContent=k;e.onclick=()=>SH(k);bd.appendChild(e)}
SH('overview');addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
window.shot=k=>{SH(k);city.tick(3);R.render(S,C);return R.domElement.toDataURL()};
const fe=document.getElementById('fps');let fc=0,ft=performance.now();
R.setAnimationLoop(now=>{city.tick(now/1000);O.update();R.render(S,C);fc++;if(now-ft>500){fe.textContent=(fc*1000/(now-ft)).toFixed(0)+' fps';fc=0;ft=now}});window.ready=true;
</script></body></html>
