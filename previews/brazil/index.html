const SH={full:[[0,15.4,7.2],[0,-.1,.3]]};for(const [k,lo,la,d,el] of [["rio", -43.23, -22.92, 0.8, 1.1], ["spz", -46.63, -23.56, 0.18, 0.9], ["rioz", -43.3, -22.88, 0.2, 0.9], ["recife", -34.92, -8.07, 0.5, 1.0], ["sp", -46.63, -23.56, 0.6, 1.1], ["west", -73.2, -7.5, 0.6, 0.9], ["south", -53.3, -33.5, 0.6, 0.9], ["manaus", -60, -3.1, 0.7, 0.9]]){const [x,z]=ll(lo,la);SH[k]=[[x-d*.15,Math.abs(d)*el,z+d],[x,.02,z]];}
window.SH=SH;window.shot=(k,t=0)=>{const s=SH[k];cam.position.set(...s[0]);ctl.target.set(...s[1]);ctl.update();U.t.value=t;R.render(sc,cam);return R.domElement.toDataURL('image/png');};
window.ready=true;
const st=Q.get('spot');shot(st&&SH[st]?st:'full');
if(!STILL){const clk=new THREE.Clock();let fr=0,last=performance.now();R.setAnimationLoop(()=>{U.t.value=clk.getElapsedTime();ctl.update();R.render(sc,cam);fr++;const n=performance.now();if(n-last>1000){document.getElementById('fps').textContent=Math.round(fr*1000/(n-last))+' fps';fr=0;last=n;}});
 addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});}
</script></body></html>
