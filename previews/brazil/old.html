<div id="ui">Brazil HD preview · drag to orbit, scroll to zoom · look: <a href="?look=1">1</a><a href="?look=2">2</a><a href="?look=3">3</a></div><div id="fps"></div>
<script type="module">
import * as THREE from 'three';import {RoomEnvironment} from './RoomEnvironment.js';import {OrbitControls} from './OrbitControls.js';
const Q=new URLSearchParams(location.search),LOOK=+(Q.get('look')||2),FX=Q.get('fx')!=='0',STILL=Q.has('still');
const S=await (await fetch('hd_shape.json')).json();const Hu=10,Wu=10*S.W/S.H,DS=.12;

const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:STILL});R.setPixelRatio(STILL?1:Math.min(devicePixelRatio,2));R.setSize(W2,H2);
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0d1217);sc.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),.04).texture;sc.environmentIntensity=.3;

const key=new THREE.DirectionalLight(0xfff1dc,2.4);key.position.set(-7,9,-3);key.castShadow=true;key.shadow.mapSize.set(4096,4096);Object.assign(key.shadow.camera,{left:-7,right:7,top:7,bottom:-7,far:40});key.shadow.bias=-.0004;key.shadow.normalBias=.02;sc.add(key);

const TL=new THREE.TextureLoader();const tex=async(u,srgb=true)=>{const t=await TL.loadAsync(u);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=R.capabilities.getMaxAnisotropy();return t};
const img=async u=>{const i=new Image();i.src=u;await i.decode();const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);return {w:i.width,h:i.height,d:x.getImageData(0,0,i.width,i.height).data}};
const HM=await img('hd_height_s.png'),MK=await img('hd_mask_s.png');
const samp=(I,u,v)=>{const x=Math.min(I.w-1,Math.max(0,u*I.w|0)),y=Math.min(I.h-1,Math.max(0,v*I.h|0));return I.d[(y*I.w+x)*4]/255};

// slab
const ring=S.ring.filter((p,i)=>i%3==0).map(p=>new THREE.Vector2((p[0]/S.W-.5)*Wu,-(p[1]/S.H-.5)*Hu));
const sg=new THREE.ExtrudeGeometry(new THREE.Shape(ring),{depth:.3,bevelEnabled:true,bevelThickness:.03,bevelSize:.025,bevelSegments:3,curveSegments:1});
const slab=new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color:LOOK==3?0xd9cdb4:0x3b3128,roughness:.6}));slab.rotation.x=-Math.PI/2;slab.position.y=-.335;slab.castShadow=slab.receiveShadow=true;sc.add(slab);
// terrain
const tg=new THREE.PlaneGeometry(Wu,Hu,1400,1440);tg.rotateX(-Math.PI/2);
const tm=new THREE.MeshStandardMaterial({map:await tex(`hd_c${LOOK}.jpg`),displacementMap:await tex('hd_height_s.png',false),displacementScale:DS,normalMap:await tex('hd_normal.jpg',false),normalScale:new THREE.Vector2(LOOK==3?.5:1,LOOK==3?.5:1),alphaMap:await tex('hd_mask_s.png',false),alphaTest:.5,roughness:LOOK==2?.7:.9});
if(LOOK==2){tm.emissiveMap=await tex('hd_e2.jpg');tm.emissive=new THREE.Color(1,1,1);tm.emissiveIntensity=FX?.15:.5;}
const terr=new THREE.Mesh(tg,tm);terr.position.y=.0;terr.castShadow=terr.receiveShadow=true;sc.add(terr);
const U={t:{value:0}};
// ocean + coastal foam
{const og=new THREE.PlaneGeometry(Wu,Hu,1,1);og.rotateX(-Math.PI/2);const ct=await tex('coast.png',false);
 const om=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{t:U.t,c:{value:ct}},vertexShader:`varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float t;uniform sampler2D c;varying vec2 vUv;varying vec3 vW;
 float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
 void main(){float k=texture2D(c,vUv).r;if(k<.01)discard;float d=1.-k;float nz=n(vUv*900.+t*.3)*.6+n(vUv*260.-t*.2)*.4;
 float band=smoothstep(.75,1.,sin(d*38.-t*1.6+nz*2.))*smoothstep(.0,.35,k)*(1.-smoothstep(.9,1.,k)*.3);
 float shore=smoothstep(.86,.97,k+nz*.08);float foam=max(band*.7*k,shore)*(.6+.4*nz);
 vec3 water=mix(vec3(.05,.17,.24),vec3(.12,.42,.48),k*k);gl_FragColor=vec4(mix(water,vec3(.93,.96,.97),foam),max(k*.75,foam));
 #include <colorspace_fragment>
 }`});
 const o=new THREE.Mesh(og,om);o.position.y=.004;o.renderOrder=2;sc.add(o);}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x10171d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.8;ground.receiveShadow=true;sc.add(ground);
if(FX){
 // rivers
 const RV=await (await fetch('rivers_main.json')).json();const pos=[],uvs=[],idx=[];
 for(const r of RV){const pts=r.p.map(p=>W(p[0],p[1]));if(pts.length<2)continue;let s=0;const w=.0035*r.w;
  for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const d=new THREE.Vector3().subVectors(b,a).setY(0).normalize();const nn=new THREE.Vector3(-d.z,0,d.x).multiplyScalar(w);
   if(i)s+=pts[i].distanceTo(pts[i-1]);const p=pts[i];const y=p.y+.012;const base=pos.length/3;pos.push(p.x+nn.x,y,p.z+nn.z,p.x-nn.x,y,p.z-nn.z);uvs.push(s*40,0,s*40,1);
   if(i)idx.push(base-2,base-1,base,base-1,base+1,base);}}
 const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));rg.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));rg.setIndex(idx);
 const rm=new THREE.ShaderMaterial({transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,uniforms:{t:U.t},vertexShader:`varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
 fragmentShader:`uniform float t;varying vec2 vUv;varying vec3 vW;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
 void main(){vec2 q=vec2(vUv.x-t*1.2,vUv.y*3.);float r=n(q*vec2(1.,2.))*.6+n(q*vec2(3.,5.)+7.)*.4;float edge=1.-pow(abs(vUv.y*2.-1.),3.);
 vec3 V=normalize(cameraPosition-vW);float fr=pow(1.-max(V.y,0.),3.);vec3 col=mix(vec3(.07,.24,.3),vec3(.55,.72,.8),fr*.8+.15);float glint=smoothstep(.72,.9,r)*.6;col+=glint*vec3(1.,.95,.85)*.5;
 gl_FragColor=vec4(col,.82*edge);
 #include <colorspace_fragment>
 }`});const rmesh=new THREE.Mesh(rg,rm);rmesh.renderOrder=3;sc.add(rmesh);
 // trees
 const FD=await img('forest.png');const tree=new THREE.IcosahedronGeometry(.0042,0);tree.scale(1,1.35,1);tree.translate(0,.0055,0);
 const sway=m=>{m.onBeforeCompile=s=>{s.uniforms.t=U.t;s.vertexShader='uniform float t;\n'+s.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
  vec4 ip=instanceMatrix[3];float ph=ip.x*37.+ip.z*23.;transformed.x+=sin(t*1.7+ph)*.08*position.y;transformed.z+=cos(t*1.3+ph)*.06*position.y;`)}};
 const tmat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.85,flatShading:true});sway(tmat);
 const N=Q.get('trees')?+Q.get('trees'):90000;const im=new THREE.InstancedMesh(tree,tmat,N);let c=0;const M=new THREE.Matrix4(),col=new THREE.Color(),qq=new THREE.Quaternion();
 for(let k=0;k<N*6&&c<N;k++){const u=Math.random(),v=Math.random();const f=samp(FD,u,v);if(Math.random()>f*f||samp(MK,u,v)<.5)continue;const p=W(u,v);const s=.6+Math.random()*.8;
  M.compose(p,qq.setFromAxisAngle(new THREE.Vector3(0,1,0),Math.random()*6),new THREE.Vector3(s,s*(.8+Math.random()*.5),s));im.setMatrixAt(c,M);col.setHSL(.25+Math.random()*.07,.35+Math.random()*.2,.07+Math.random()*.07);im.setColorAt(c++,col);}
 im.count=c;im.castShadow=true;sc.add(im);window.treeCount=c;
 // cities
 const C=[['São Paulo',-46.63,-23.55,22],['Rio de Janeiro',-43.2,-22.9,13.5],['Belo Horizonte',-43.94,-19.92,6],['Brasília',-47.88,-15.79,4.8],['Porto Alegre',-51.23,-30.03,4.3],['Fortaleza',-38.54,-3.72,4.1],['Recife',-34.9,-8.05,4.1],['Salvador',-38.5,-12.97,4],['Curitiba',-49.27,-25.43,3.7],['Manaus',-60.02,-3.1,2.3]];
 const bg=new THREE.BoxGeometry(1,1,1);bg.translate(0,.5,0);const bm=new THREE.MeshStandardMaterial({color:0x8f9aa4,roughness:.35,metalness:.3});
 const fg=new THREE.CapsuleGeometry(.0004,.0012,2,4);fg.translate(0,.001,0);const fm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.7});
 const NB=C.reduce((a,c)=>a+Math.round(c[3]*140),0),NF=C.reduce((a,c)=>a+Math.round(c[3]*120),0);const B=new THREE.InstancedMesh(bg,bm,NB),F=new THREE.InstancedMesh(fg,fm,NF);let bi=0,fi=0;
 for(const [n,lo,la,pop] of C){const u=(lo+74.5)/40.5,v=(5.8-la)/40.3;const c0=W(u,v);const rad=.018*Math.sqrt(pop);const big=pop>=4;
  for(let i=0;i<Math.round(pop*140);i++){const a=Math.random()*6.283,r=rad*Math.pow(Math.random(),.7);const x=c0.x+Math.cos(a)*r,z=c0.z+Math.sin(a)*r;const near=1-r/rad;
   const hgt=big?.002+Math.pow(near,2.2)*.012*Math.sqrt(pop/4)*(.4+Math.random()):.0015+Math.random()*.002;const wdt=.0012+Math.random()*.0012;
   const y=samp(HM,(x/Wu+.5),(z/Hu+.5))*DS;M.compose(new THREE.Vector3(x,y,z),qq.setFromAxisAngle(new THREE.Vector3(0,1,0),.3),new THREE.Vector3(wdt,hgt,wdt));B.setMatrixAt(bi,M);
   col.setHSL(.58,.08+Math.random()*.1,(hgt>.006?.32:.45)+Math.random()*.15);B.setColorAt(bi++,col);}
  for(let i=0;i<Math.round(pop*120);i++){const a=Math.random()*6.283,r=rad*(.2+Math.random()*1.1);const x=c0.x+Math.cos(a)*r,z=c0.z+Math.sin(a)*r;const y=samp(HM,(x/Wu+.5),(z/Hu+.5))*DS;
   M.compose(new THREE.Vector3(x,y,z),qq.identity(),new THREE.Vector3(1,1,1));F.setMatrixAt(fi,M);col.setHSL(Math.random(),.35,.35);F.setColorAt(fi++,col);}}
 B.castShadow=B.receiveShadow=true;sc.add(B,F);window.cityCount=[bi,fi];
}
const cam=new THREE.PerspectiveCamera(30,W2/H2,.005,200);const ctl=new OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.maxPolarAngle=1.35;ctl.minDistance=.05;ctl.maxDistance=40;
const SH={full:[[0,15.2,7.0],[0,-.1,.3]],zoom:[[2.79-.1,1.0,2.12+.75],[2.75,.03,2.05]],zoom2:[[-.66,.9,1.65],[-.66,.03,.9]],manaus:[[-1.45,.55,-3.0],[-1.6,.03,-3.85]]};
window.shot=(k,t=0)=>{const s=SH[k];cam.position.set(...s[0]);ctl.target.set(...s[1]);ctl.update();U.t.value=t;R.render(sc,cam);return R.domElement.toDataURL('image/png');};
window.lerpShot=(a,b,f,t)=>{const A=SH[a],B=SH[b],e=f*f*(3-2*f);cam.position.set(...A[0].map((x,i)=>x+(B[0][i]-x)*e));ctl.target.set(...A[1].map((x,i)=>x+(B[1][i]-x)*e));ctl.update();U.t.value=t;R.render(sc,cam);};
window.ready=true;
if(!STILL){shot('full');const clk=new THREE.Clock();let fr=0,last=performance.now();R.setAnimationLoop(()=>{U.t.value=clk.getElapsedTime();ctl.update();R.render(sc,cam);fr++;const n=performance.now();if(n-last>1000){document.getElementById('fps').textContent=Math.round(fr*1000/(n-last))+' fps';fr=0;last=n;}});

</script></body></html>
