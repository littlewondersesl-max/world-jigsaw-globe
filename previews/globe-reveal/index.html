<!doctype html><html><head><meta charset="utf-8"><title>Globe Reveal – Brazil</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font:13px system-ui;color:#ddd}
#ui{position:fixed;left:14px;top:12px;z-index:2;background:#0008;padding:8px 12px;border-radius:8px}
button{background:#222;color:#ddd;border:1px solid #555;border-radius:5px;padding:4px 9px;margin:2px;cursor:pointer}button.on{background:#c9a46a;color:#111}
a{color:#c9a46a}</style>
<script type="importmap">{"imports":{"three":"../brazil/three.module.js"}}</script></head><body>
<div id="ui"><b>Drag Brazil from the box onto the globe</b> (drop anywhere)<br>
Background: <button data-b="0" class="on">Milky Way</button><button data-b="1">Nebula</button><button data-b="2">Studio</button><button data-b="3">Sunrise</button>
<button id="reset">Reset</button> · <a href="../brazil/">Brazil look 3</a> · <a href="../brazil-showcase/">Rio showcase</a></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from '../brazil/OrbitControls.js';
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,devicePixelRatio));R.setSize(innerWidth,innerHeight);
R.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,200);C.position.set(0,.6,6.2);
const O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.minDistance=2.2;O.maxDistance=12;
const sun=new THREE.Vector3(-.6,.5,.65).normalize();
S.add(new THREE.AmbientLight(0xffffff,.35));const dl=new THREE.DirectionalLight(0xfff2e0,2.2);dl.position.copy(sun).multiplyScalar(10);S.add(dl);
const U={t:{value:0},bg:{value:0},sun:{value:sun}};
// procedural backgrounds (all generated in-shader: no external assets)
const NO=`float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fb(vec3 p){float a=.5,s=0.;for(int i=0;i<6;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}`;
const bg=new THREE.Mesh(new THREE.SphereGeometry(100,64,32),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:U,
vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:NO+`uniform float bg;varying vec3 d;
float stars(vec3 d,float s,float th){vec3 p=d*s;vec3 i=floor(p);float r=h(i);vec3 c=i+.5+.35*(vec3(h(i+3.1),h(i+7.7),h(i+1.3))-.5);float k=length(p-c);return r>th?smoothstep(.12,0.,k)*(r-th)/(1.-th):0.;}
void main(){vec3 c;
if(bg<.5){vec3 g=normalize(vec3(.3,1.,.2));float b=abs(dot(d,g));float band=exp(-b*b*18.);float dust=fb(d*6.);
c=vec3(.006,.008,.016)+band*vec3(.16,.14,.12)*(.4+dust)-band*smoothstep(.55,.75,fb(d*9.+2.))*vec3(.1);
c+=stars(d,260.,.93)*vec3(1.)+stars(d,600.,.97)*.6*(1.+band*3.);}
else if(bg<1.5){float a=fb(d*2.5),b=fb(d*4.+5.);c=vec3(.01,.01,.02)+pow(a,3.)*vec3(.5,.12,.35)+pow(b,4.)*vec3(.1,.35,.6);c+=stars(d,300.,.95);}
else if(bg<2.5){float y=d.y*.5+.5;c=mix(vec3(.02,.02,.025),vec3(.16,.15,.14),pow(1.-abs(d.y),3.));}
else{float y=d.y;float s=max(dot(d,normalize(vec3(.7,.02,-.7))),0.);c=mix(vec3(.95,.55,.3),vec3(.08,.16,.35),smoothstep(-.02,.45,y));c+=pow(s,60.)*vec3(1.,.8,.5)*2.+pow(s,6.)*vec3(.5,.25,.1);if(y<0.)c=mix(vec3(.05,.05,.07),c,exp(y*30.));c+=stars(d,300.,.97)*smoothstep(.3,.8,y);}
gl_FragColor=vec4(c,1.);}`}));S.add(bg);
// realistic animated ocean globe (no graticule lines)
const G=new THREE.Group();S.add(G);
const ocean=new THREE.Mesh(new THREE.SphereGeometry(1.5,160,96),new THREE.ShaderMaterial({uniforms:U,
vertexShader:`varying vec3 p,wn,wp;void main(){p=position;wn=normalize(mat3(modelMatrix)*normal);wp=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.);}`,
fragmentShader:NO+`uniform float t;uniform vec3 sun;varying vec3 p,wn,wp;
void main(){vec3 q=normalize(p);float e=.0025;vec3 a=q*40.+vec3(t*.15,0,t*.1);
float g0=fb(a),gx=fb(a+vec3(e*40.,0,0)),gy=fb(a+vec3(0,e*40.,0)),gz=fb(a+vec3(0,0,e*40.));
vec3 N=normalize(wn-.35*vec3(gx-g0,gy-g0,gz-g0)/ (e*40.)*.05);
vec3 V=normalize(cameraPosition-wp);float fr=pow(1.-max(dot(N,V),0.),5.);
float lat=abs(q.y);vec3 deep=mix(vec3(.01,.06,.13),vec3(.02,.12,.2),fb(q*5.)*.8+.1*(1.-lat));
float dif=max(dot(N,sun),0.);vec3 H=normalize(sun+V);float sp=pow(max(dot(N,H),0.),600.)*.7+pow(max(dot(N,H),0.),40.)*.06;
vec3 c=deep*(.25+.9*dif)+mix(vec3(0),vec3(.35,.5,.7),fr)+sp*vec3(1.,.95,.85);
gl_FragColor=vec4(c,1.);}`}));G.add(ocean);
const atm=new THREE.Mesh(new THREE.SphereGeometry(1.56,96,64),new THREE.ShaderMaterial({transparent:true,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:U,
vertexShader:`varying vec3 n,v;void main(){n=normalize(normalMatrix*normal);v=normalize(-(modelViewMatrix*vec4(position,1.)).xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 n,v;void main(){float k=pow(1.-abs(dot(n,v)),5.);gl_FragColor=vec4(vec3(.3,.55,1.)*k*.7,k);}`}));G.add(atm);
// Brazil piece: one grid, morphs between flat wood piece (in box) and spherical map patch (on globe)
const sh=await (await fetch('../brazil/shape.json')).json();const [x0,y0,x1,y1]=sh.bbox;
const L=new THREE.TextureLoader(),tx=n=>{const t=L.load('../brazil/'+n);t.anisotropy=8;return t};
const map=tx('c3.jpg');map.colorSpace=THREE.SRGBColorSpace;const mask=tx('mask.png'),hgt=tx('height.png'),nrm=tx('normal.jpg');
const FS=.85; // flat scale in box
const PU={...U,m:{value:0},map:{value:map},mask:{value:mask},hgt:{value:hgt},nrm:{value:nrm},bb:{value:new THREE.Vector4(x0,y0,x1,y1)},fs:{value:FS},side:{value:0}};
const mkMat=side=>new THREE.ShaderMaterial({uniforms:{...PU,side:{value:side}},side:THREE.DoubleSide,
vertexShader:`uniform float m,fs,side;uniform vec4 bb;uniform sampler2D hgt;varying vec2 vu;varying vec3 wn,wp;
void main(){vu=uv;float lon=mix(bb.x,bb.z,uv.x),lat=mix(bb.y,bb.w,uv.y);float hh=texture2D(hgt,uv).r;hh*=hh;
float la=radians(lat),lo=radians(lon);vec3 s=vec3(cos(la)*sin(lo),sin(la),cos(la)*cos(lo));
float th=side>.5?-.018:0.;vec3 sp=s*(1.5+.004+hh*.03*m+th*.4*(1.-m)+(side>.5?-.004*m:0.));
vec3 fl=vec3((uv.x-.5)*(bb.z-bb.x),(uv.y-.5)*(bb.w-bb.y),0.)*fs/40.+vec3(0,0,th*.6);
vec3 P=mix(fl,sp,m);wn=mix(vec3(0,0,1),s,m);wp=(modelMatrix*vec4(P,1.)).xyz;wn=normalize(mat3(modelMatrix)*wn);gl_Position=projectionMatrix*viewMatrix*vec4(wp,1.);}`,
fragmentShader:NO+`uniform float m,side,t;uniform vec3 sun;uniform sampler2D map,mask,nrm;varying vec2 vu;varying vec3 wn,wp;
void main(){float a=texture2D(mask,vu).r;if(a<.5)discard;
// fine-grain oiled wood (style C): straight close grain, soft figure, warm oil sheen
vec2 w=vu*vec2(1.,3.);float g=fb(vec3(w.x*3.,w.y*70.+fb(vec3(w*4.,1.))*3.,0.));float ring=sin((w.y*90.+fb(vec3(w*6.,2.))*6.))*.5+.5;
vec3 wood=mix(vec3(.42,.25,.12),vec3(.62,.42,.24),g*.8+ring*.2);wood*=.9+.1*n(vec3(vu*900.,0.));
if(side>.5)wood*=.55;
vec3 tn=texture2D(nrm,vu).xyz*2.-1.;vec3 N=normalize(wn+tn.x*.0+vec3(0));
vec3 mp=texture2D(map,vu).rgb;mp=pow(mp,vec3(2.2));
float sw=vu.x*.5+(1.-vu.y)*.5;float k=side>.5?0.:smoothstep(sw-.12,sw+.12,m*1.5-.3);
vec3 base=mix(wood,mp,k);
vec3 V=normalize(cameraPosition-wp);vec3 H=normalize(sun+V);float dif=max(dot(N,sun),0.);
float sp=pow(max(dot(N,H),0.),60.)*.3*(1.-k);
vec3 c=base*(.3+.95*dif)+sp;gl_FragColor=vec4(pow(c,vec3(1./2.2)),1.);}`});
const geo=new THREE.PlaneGeometry(1,1,260,260);
const piece=new THREE.Group();const top=new THREE.Mesh(geo,mkMat(0)),bot=new THREE.Mesh(geo,mkMat(1));piece.add(top,bot);
const mats=[top.material,bot.material];const setM=v=>mats.forEach(q=>q.uniforms.m.value=v);
// wooden box (oiled walnut tray)
const woodBox=new THREE.MeshStandardMaterial({color:0x5a3a22,roughness:.55});const inner=new THREE.MeshStandardMaterial({color:0x1d1712,roughness:.95});
const box=new THREE.Group();const bw=1.0,bd=1.0;
const fl=new THREE.Mesh(new THREE.BoxGeometry(bw,.03,bd),inner);box.add(fl);
for(const [x,z,sx,sz] of [[0,bd/2,bw+.06,.06],[0,-bd/2,bw+.06,.06],[bw/2,0,.06,bd],[-bw/2,0,.06,bd]]){const w=new THREE.Mesh(new THREE.BoxGeometry(sx,.1,sz),woodBox);w.position.set(x,.04,z);box.add(w);}
box.position.set(2.2,-1.05,1.6);box.rotation.set(.35,-.45,0);box.scale.setScalar(1.25);S.add(box);
const home=()=>{box.add(piece);piece.position.set(0,.035,0);piece.rotation.set(-Math.PI/2,0,0);piece.scale.setScalar(1);setM(0);};home();
// drag & drop
const rc=new THREE.Raycaster(),mv=new THREE.Vector2();let drag=false,anim=null;const plane=new THREE.Plane();
const ndc=e=>mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);
R.domElement.addEventListener('pointerdown',e=>{if(anim)return;ndc(e);rc.setFromCamera(mv,C);if(rc.intersectObject(top).length&&piece.parent===box){drag=true;O.enabled=false;
const wp=new THREE.Vector3();piece.getWorldPosition(wp);S.attach(piece);plane.setFromNormalAndCoplanarPoint(C.getWorldDirection(new THREE.Vector3()).negate(),wp);}});
addEventListener('pointermove',e=>{if(!drag)return;ndc(e);rc.setFromCamera(mv,C);const p=new THREE.Vector3();if(rc.ray.intersectPlane(plane,p))piece.position.copy(p);});
addEventListener('pointerup',()=>{if(!drag)return;drag=false;O.enabled=true;drop();});
function doosh(){const A=new (window.AudioContext||window.webkitAudioContext)(),T=A.currentTime;
const len=A.sampleRate*1.2,b=A.createBuffer(1,len,A.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
const s=A.createBufferSource();s.buffer=b;const f=A.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2500,T);f.frequency.exponentialRampToValueAtTime(120,T+.9);
const g=A.createGain();g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(.8,T+.04);g.gain.exponentialRampToValueAtTime(.001,T+1.1);s.connect(f).connect(g).connect(A.destination);s.start();
const o=A.createOscillator(),og=A.createGain();o.frequency.setValueAtTime(110,T);o.frequency.exponentialRampToValueAtTime(38,T+.5);og.gain.setValueAtTime(.6,T);og.gain.exponentialRampToValueAtTime(.001,T+.6);o.connect(og).connect(A.destination);o.start();o.stop(T+.7);}
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function drop(){// target: globe rotation so Brazil centre faces camera; piece snaps to its true spot (1:1 globe scale)
const lo=THREE.MathUtils.degToRad((x0+x1)/2),la=THREE.MathUtils.degToRad((y0+y1)/2);
const tq=new THREE.Quaternion().setFromEuler(new THREE.Euler(la*.8,-lo,0,'YXZ'));
const camDir=C.position.clone().normalize();const q0=G.quaternion.clone();
const tq2=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(Math.cos(la)*Math.sin(lo),Math.sin(la),Math.cos(la)*Math.cos(lo)),camDir);
const p0=piece.position.clone(),r0=piece.quaternion.clone();const t0=performance.now();let snd=false;
anim=now=>{let x=Math.min(1,(now-t0)/2200),e=ease(x);G.quaternion.slerpQuaternions(q0,tq2,ease(Math.min(1,x*1.6)));
// piece flies: blend world transform to globe's frame while geometry morphs flat->sphere
const gp=G.position,gq=G.quaternion;piece.position.lerpVectors(p0,gp,e);piece.quaternion.slerpQuaternions(r0,gq,e);
const m=Math.min(1,Math.max(0,(x-.25)/.75));setM(ease(m));if(x>.5&&!snd){snd=true;try{doosh()}catch(_){}}
if(x>=1){G.attach(piece);anim=null;}};}
document.getElementById('reset').onclick=()=>{anim=null;home();};
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{U.bg.value=+b.dataset.b;document.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on',x===b));});
const q=new URLSearchParams(location.search);if(q.has('bg'))U.bg.value=+q.get('bg');
window.autodrop=()=>{S.attach(piece);drop();};window.jump=()=>{if(anim)anim(performance.now()+1e5);};
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight);});
R.setAnimationLoop(now=>{U.t.value=now/1000;if(anim)anim(now);else if(piece.parent!==G&&!drag)G.rotation.y+=.0008;O.update();R.render(S,C);});
window.ready=true;if(q.has("nobot"))bot.visible=false;if(q.has("noatm"))atm.visible=false;
</script></body></html>
